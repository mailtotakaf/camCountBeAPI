AWSTemplateFormatVersion: "2010-09-09"
Description: Store people count backend (API Gateway + Lambda + DynamoDB + LINE notify via Messaging API + LIFF register)

Parameters:
  ProjectName:
    Type: String
    Default: store-people

  StaleSeconds:
    Type: Number
    Default: 120

  LineChannelAccessToken:
    Type: String
    NoEcho: true
    Description: "LINE Messaging API channel access token (long-lived)"

  LineLoginChannelId:
    Type: String
    Description: "LINE Login channel ID (same provider as LIFF)"

Resources:
  StoreStatusTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-store_status"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: store_id
          AttributeType: N
      KeySchema:
        - AttributeName: store_id
          KeyType: HASH

  StoreEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-store_events"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: store_id
          AttributeType: N
        - AttributeName: ts
          AttributeType: N
      KeySchema:
        - AttributeName: store_id
          KeyType: HASH
        - AttributeName: ts
          KeyType: RANGE

  StoreSubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-store_subscriptions"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: store_id
          AttributeType: N
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: store_id
          KeyType: HASH
        - AttributeName: user_id
          KeyType: RANGE

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt StoreStatusTable.Arn
                  - !GetAtt StoreEventsTable.Arn
                  - !GetAtt StoreSubscriptionsTable.Arn

  # -----------------------------
  # Lambda: ingest (immediate notify for zero / threshold)
  # -----------------------------
  IngestFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-ingest"
      Runtime: python3.12
      Handler: index.ingest_handler
      Role: !GetAtt ApiRole.Arn
      Timeout: 15
      Environment:
        Variables:
          STORE_STATUS_TABLE: !Ref StoreStatusTable
          STORE_EVENTS_TABLE: !Ref StoreEventsTable
          SUBS_TABLE: !Ref StoreSubscriptionsTable
          STALE_SECONDS: !Ref StaleSeconds
          LINE_CHANNEL_ACCESS_TOKEN: !Ref LineChannelAccessToken
      Code:
        ZipFile: |
          import json, os, time, urllib.request
          import boto3
          from boto3.dynamodb.conditions import Key

          ddb = boto3.resource("dynamodb")
          status_tbl = ddb.Table(os.environ["STORE_STATUS_TABLE"])
          events_tbl = ddb.Table(os.environ["STORE_EVENTS_TABLE"])
          subs_tbl = ddb.Table(os.environ["SUBS_TABLE"])
          STALE = int(os.environ.get("STALE_SECONDS", "120"))
          LINE_TOKEN = os.environ.get("LINE_CHANNEL_ACCESS_TOKEN", "")

          def _resp(code, body):
            return {
              "statusCode": code,
              "headers": {
                "Content-Type": "application/json",
                "Access-Control-Allow-Origin": "*",
                "Access-Control-Allow-Headers": "*",
                "Access-Control-Allow-Methods": "OPTIONS,GET,POST",
              },
              "body": json.dumps(body, ensure_ascii=False)
            }

          def _line_push(to_user_id: str, text: str):
            if not LINE_TOKEN:
              return
            url = "https://api.line.me/v2/bot/message/push"
            payload = json.dumps({
              "to": to_user_id,
              "messages": [{"type": "text", "text": text}]
            }, ensure_ascii=False).encode("utf-8")

            req = urllib.request.Request(url, data=payload, method="POST")
            req.add_header("Content-Type", "application/json")
            req.add_header("Authorization", f"Bearer {LINE_TOKEN}")
            with urllib.request.urlopen(req, timeout=10) as r:
              r.read()

          def ingest_handler(event, context):
            if event.get("httpMethod") == "OPTIONS":
              return _resp(200, {"ok": True})

            try:
              body = json.loads(event.get("body") or "{}")
              store_id = int(body["store_id"])
              count = int(body["count"])
              source = str(body.get("source") or "unknown")
            except Exception as e:
              return _resp(400, {"error": f"bad request: {str(e)}"})

            now = int(time.time())

            # get previous status (for edge detection)
            prev_count = None
            try:
              prev = status_tbl.get_item(Key={"store_id": store_id}).get("Item")
              if prev and "current_count" in prev:
                prev_count = int(prev["current_count"])
            except:
              prev_count = None

            # 1) append event
            events_tbl.put_item(Item={
              "store_id": store_id,
              "ts": now,
              "count": count,
              "source": source,
            })

            # 2) upsert latest (+ reset stale_notified_at so stale check can notify again after recovery)
            status_tbl.update_item(
              Key={"store_id": store_id},
              UpdateExpression="SET current_count=:c, last_seen_at=:t, updated_at=:t, stale_notified_at=:z",
              ExpressionAttributeValues={":c": count, ":t": now, ":z": 0}
            )

            # 3) notify (zero / threshold) only when crossing boundary
            #    - zero: prev != 0 and now == 0
            #    - threshold: prev > thr and now <= thr
            if prev_count is not None and prev_count == count:
              return _resp(200, {"ok": True, "store_id": store_id, "count": count, "ts": now})

            try:
              res = subs_tbl.query(
                KeyConditionExpression=Key("store_id").eq(store_id),
                Limit=1000
              )
              subs = res.get("Items", [])
            except:
              subs = []

            for s in subs:
              if not s.get("enabled", True):
                continue
              user_id = s.get("user_id")
              if not user_id:
                continue

              # zero
              if s.get("notify_zero", False):
                if prev_count is not None and prev_count != 0 and count == 0:
                  _line_push(user_id, f"店舗{store_id}：客数が0人になりました（0人）")

              # threshold
              thr = s.get("threshold", None)
              if thr is not None:
                try:
                  thr = int(thr)
                except:
                  thr = None

              if thr is not None:
                # user message requirement:
                # 店舗101：客数がしきい値以下です（2人）
                if prev_count is not None and prev_count > thr and count <= thr:
                  _line_push(user_id, f"店舗{store_id}：客数がしきい値以下です（{count}人）")

            return _resp(200, {"ok": True, "store_id": store_id, "count": count, "ts": now})

  # -----------------------------
  # Lambda: query (unchanged API)
  # -----------------------------
  QueryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-query"
      Runtime: python3.12
      Handler: index.query_handler
      Role: !GetAtt ApiRole.Arn
      Timeout: 10
      Environment:
        Variables:
          STORE_STATUS_TABLE: !Ref StoreStatusTable
          STORE_EVENTS_TABLE: !Ref StoreEventsTable
          STALE_SECONDS: !Ref StaleSeconds
      Code:
        ZipFile: |
          import json, os, time, datetime
          import boto3
          from boto3.dynamodb.conditions import Key

          ddb = boto3.resource("dynamodb")
          status_tbl = ddb.Table(os.environ["STORE_STATUS_TABLE"])
          events_tbl = ddb.Table(os.environ["STORE_EVENTS_TABLE"])
          STALE = int(os.environ.get("STALE_SECONDS", "120"))

          def _iso(ts):
            dt = datetime.datetime.fromtimestamp(ts, tz=datetime.timezone(datetime.timedelta(hours=9)))
            return dt.isoformat()

          def _resp(code, body):
            return {
              "statusCode": code,
              "headers": {
                "Content-Type": "application/json",
                "Access-Control-Allow-Origin": "*",
                "Access-Control-Allow-Headers": "*",
                "Access-Control-Allow-Methods": "OPTIONS,GET",
              },
              "body": json.dumps(body, ensure_ascii=False)
            }

          def query_handler(event, context):
            if event.get("httpMethod") == "OPTIONS":
              return _resp(200, {"ok": True})

            path = event.get("path") or ""
            qs = event.get("queryStringParameters") or {}

            if path.endswith("/stores/summary"):
              now = int(time.time())
              items = status_tbl.scan().get("Items", [])
              out = []
              for x in items:
                last = int(x.get("last_seen_at", 0))
                cnt = int(x.get("current_count", 0))
                stale = (now - last) > STALE
                if cnt == 0:
                  status = "zero"
                elif stale:
                  status = "stale"
                else:
                  status = "ok"
                out.append({
                  "store_id": int(x["store_id"]),
                  "current_count": cnt,
                  "last_seen_at": _iso(last) if last else None,
                  "status": status
                })
              out.sort(key=lambda r: r["store_id"])
              return _resp(200, out)

            if "/stores/" in path and path.endswith("/events"):
              try:
                parts = path.split("/stores/")[1].split("/")
                store_id = int(parts[0])
              except:
                return _resp(400, {"error": "invalid store id"})

              limit = int(qs.get("limit") or 200)
              res = events_tbl.query(
                KeyConditionExpression=Key("store_id").eq(store_id),
                ScanIndexForward=False,
                Limit=limit
              )
              items = res.get("Items", [])
              out = [{
                "ts": _iso(int(i["ts"])),
                "count": int(i["count"]),
                "source": i.get("source")
              } for i in items]
              return _resp(200, {"store_id": store_id, "events": out})

            return _resp(404, {"error": "not found", "path": path})

  # -----------------------------
  # Lambda: register (LIFF id_token verify -> save subscription)
  # -----------------------------
  RegisterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-register"
      Runtime: python3.12
      Handler: index.register_handler
      Role: !GetAtt ApiRole.Arn
      Timeout: 15
      Environment:
        Variables:
          SUBS_TABLE: !Ref StoreSubscriptionsTable
          LINE_LOGIN_CHANNEL_ID: !Ref LineLoginChannelId
      Code:
        ZipFile: |
          import json, os, time, urllib.request, urllib.parse
          import boto3

          ddb = boto3.resource("dynamodb")
          subs_tbl = ddb.Table(os.environ["SUBS_TABLE"])
          CLIENT_ID = os.environ["LINE_LOGIN_CHANNEL_ID"]

          def _resp(code, body):
            return {
              "statusCode": code,
              "headers": {
                "Content-Type": "application/json",
                "Access-Control-Allow-Origin": "*",
                "Access-Control-Allow-Headers": "*",
                "Access-Control-Allow-Methods": "OPTIONS,POST",
              },
              "body": json.dumps(body, ensure_ascii=False)
            }

          def _verify_id_token(id_token: str):
            # POST https://api.line.me/oauth2/v2.1/verify (x-www-form-urlencoded)
            url = "https://api.line.me/oauth2/v2.1/verify"
            data = urllib.parse.urlencode({
              "id_token": id_token,
              "client_id": CLIENT_ID,
            }).encode("utf-8")
            req = urllib.request.Request(url, data=data, method="POST")
            req.add_header("Content-Type", "application/x-www-form-urlencoded")
            with urllib.request.urlopen(req, timeout=10) as r:
              return json.loads(r.read().decode("utf-8"))

          def register_handler(event, context):
            if event.get("httpMethod") == "OPTIONS":
              return _resp(200, {"ok": True})

            try:
              body = json.loads(event.get("body") or "{}")
              store_id = int(body["store_id"])
              id_token = str(body["id_token"])

              enabled = bool(body.get("enabled", True))
              notify_zero = bool(body.get("notify_zero", True))
              notify_stale = bool(body.get("notify_stale", False))
              threshold = body.get("threshold", None)
              if threshold is not None:
                threshold = int(threshold)
            except Exception as e:
              return _resp(400, {"error": f"bad request: {str(e)}"})

            try:
              v = _verify_id_token(id_token)
              user_id = v["sub"]  # LINE userId
            except Exception as e:
              return _resp(401, {"error": f"id_token verify failed: {str(e)}"})

            now = int(time.time())
            item = {
              "store_id": store_id,
              "user_id": user_id,
              "enabled": enabled,
              "notify_zero": notify_zero,
              "notify_stale": notify_stale,
              "created_at": now,
            }
            if threshold is not None:
              item["threshold"] = threshold

            subs_tbl.put_item(Item=item)
            return _resp(200, {"ok": True, "store_id": store_id, "user_id": user_id})

  # -----------------------------
  # Lambda: stale checker (EventBridge schedule)
  # -----------------------------
  StaleCheckFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-stale-check"
      Runtime: python3.12
      Handler: index.stale_check_handler
      Role: !GetAtt ApiRole.Arn
      Timeout: 30
      Environment:
        Variables:
          STORE_STATUS_TABLE: !Ref StoreStatusTable
          SUBS_TABLE: !Ref StoreSubscriptionsTable
          STALE_SECONDS: !Ref StaleSeconds
          LINE_CHANNEL_ACCESS_TOKEN: !Ref LineChannelAccessToken
      Code:
        ZipFile: |
          import json, os, time, urllib.request
          import boto3
          from boto3.dynamodb.conditions import Key

          ddb = boto3.resource("dynamodb")
          status_tbl = ddb.Table(os.environ["STORE_STATUS_TABLE"])
          subs_tbl = ddb.Table(os.environ["SUBS_TABLE"])
          STALE = int(os.environ.get("STALE_SECONDS", "120"))
          LINE_TOKEN = os.environ.get("LINE_CHANNEL_ACCESS_TOKEN", "")

          def _line_push(to_user_id: str, text: str):
            if not LINE_TOKEN:
              return
            url = "https://api.line.me/v2/bot/message/push"
            payload = json.dumps({
              "to": to_user_id,
              "messages": [{"type": "text", "text": text}]
            }, ensure_ascii=False).encode("utf-8")

            req = urllib.request.Request(url, data=payload, method="POST")
            req.add_header("Content-Type", "application/json")
            req.add_header("Authorization", f"Bearer {LINE_TOKEN}")
            with urllib.request.urlopen(req, timeout=10) as r:
              r.read()

          def stale_check_handler(event, context):
            now = int(time.time())
            items = status_tbl.scan().get("Items", [])

            for x in items:
              try:
                store_id = int(x["store_id"])
                last = int(x.get("last_seen_at", 0))
                if last == 0:
                  continue
                is_stale = (now - last) > STALE
                if not is_stale:
                  continue

                stale_notified_at = int(x.get("stale_notified_at", 0))
                # notify only once per stale episode (ingest resets stale_notified_at to 0)
                if stale_notified_at and stale_notified_at > 0:
                  continue

                # get subscribers
                res = subs_tbl.query(
                  KeyConditionExpression=Key("store_id").eq(store_id),
                  Limit=1000
                )
                subs = res.get("Items", [])

                for s in subs:
                  if not s.get("enabled", True):
                    continue
                  if not s.get("notify_stale", False):
                    continue
                  user_id = s.get("user_id")
                  if not user_id:
                    continue
                  _line_push(user_id, f"店舗{store_id}：送信が{STALE}秒以上止まっています")

                # mark notified
                status_tbl.update_item(
                  Key={"store_id": store_id},
                  UpdateExpression="SET stale_notified_at=:t",
                  ExpressionAttributeValues={":t": now}
                )
              except:
                continue

            return {"ok": True}

  # EventBridge schedule (every 1 minute)
  StaleCheckRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-stale-check-rule"
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Arn: !GetAtt StaleCheckFunction.Arn
          Id: StaleCheckTarget

  PermStaleCheckInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StaleCheckFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt StaleCheckRule.Arn

  # -----------------------------
  # API Gateway
  # -----------------------------
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ProjectName}-api"

  ApiResourceApi:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: api

  ApiResourceIngest:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ApiResourceApi
      PathPart: ingest

  ApiResourceRegister:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ApiResourceApi
      PathPart: register

  ApiResourceStores:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ApiResourceApi
      PathPart: stores

  ApiResourceSummary:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ApiResourceStores
      PathPart: summary

  ApiResourceStoreId:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ApiResourceStores
      PathPart: "{id}"

  ApiResourceEvents:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ApiResourceStoreId
      PathPart: events

  # Methods
  IngestPost:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ApiResourceIngest
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IngestFunction.Arn}/invocations"

  IngestOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ApiResourceIngest
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IngestFunction.Arn}/invocations"

  RegisterPost:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ApiResourceRegister
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RegisterFunction.Arn}/invocations"

  RegisterOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ApiResourceRegister
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RegisterFunction.Arn}/invocations"

  SummaryGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ApiResourceSummary
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${QueryFunction.Arn}/invocations"

  SummaryOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ApiResourceSummary
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${QueryFunction.Arn}/invocations"

  EventsGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ApiResourceEvents
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${QueryFunction.Arn}/invocations"

  EventsOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ApiResourceEvents
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${QueryFunction.Arn}/invocations"

  # Lambda permissions for API Gateway
  PermIngest:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IngestFunction
      Principal: apigateway.amazonaws.com

  PermQuery:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref QueryFunction
      Principal: apigateway.amazonaws.com

  PermRegister:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RegisterFunction
      Principal: apigateway.amazonaws.com

  Deployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - IngestPost
      - SummaryGet
      - EventsGet
      - IngestOptions
      - SummaryOptions
      - EventsOptions
      - RegisterPost
      - RegisterOptions
    Properties:
      RestApiId: !Ref RestApi
      StageName: prod

Outputs:
  ApiBaseUrl:
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/api"
